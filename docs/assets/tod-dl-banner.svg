      ACQUISITION / RECOVERY / VERIFICATION
    </text>
    <text x="70" y="165" fill="#f0f5fc" font-size="76" font-weight="700"
          letter-spacing="-3">TOD-DL</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif">
