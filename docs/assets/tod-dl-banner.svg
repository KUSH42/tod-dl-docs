<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420"
     viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TOD-DL — acquisition systems engineering</title>
  <desc id="desc">A technical schematic connects selected input, durable
    state, and verified custody. Resumable transfer, exclusive finalization,
    and signed history form the acquisition pipeline.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#203047"
            stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#101b2b"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>
  <path d="M48 48h42 M48 48v24 M1152 372h-42 M1152 372v-24"
