    <path d="M124 80l11 11 22-24" stroke="#6adbc6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="18" r="5" fill="#101b2b" stroke="#a9bbd0"/>
    <circle cx="0" cy="80" r="5" fill="#101b2b" stroke="#6adbc6"/>
    <circle cx="0" cy="142" r="5" fill="#101b2b" stroke="#a9bbd0"/>
