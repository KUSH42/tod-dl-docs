<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580"
     viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">TOD-DL — Acquire. Preserve. Verify.</title>
  <desc id="desc">A warm paper background, bold black typography, and a
    vermilion panel use the Signal specification cover design. Three open frames
    and a heavy diagonal arrow connect native acquisition, durable recovery,
    and signed provenance.</desc>
  <style>
    /* Timing follows startLogo in acquisition-motion-signal.html. */
    #capture-mark .draw-0 {
      stroke-dasharray: 1;
      animation: draw-0 4.8s linear both;
    }
    @keyframes draw-0 {
      0% { stroke-dashoffset: 1; opacity: 0; }
      4% { stroke-dashoffset: 1; opacity: 1;
        animation-timing-function: cubic-bezier(.2,.7,.2,1); }
      34%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    #capture-mark .draw-1 {
      stroke-dasharray: 1;
      animation: draw-1 4.8s linear both;
    }
    @keyframes draw-1 {
      0% { stroke-dashoffset: 1; opacity: 0; }
      11% { stroke-dashoffset: 1; opacity: 1;
        animation-timing-function: cubic-bezier(.2,.7,.2,1); }
      41%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    #capture-mark .draw-2 {
      stroke-dasharray: 1;
      animation: draw-2 4.8s linear both;
    }
    @keyframes draw-2 {
      0% { stroke-dashoffset: 1; opacity: 0; }
      18% { stroke-dashoffset: 1; opacity: 1;
        animation-timing-function: cubic-bezier(.2,.7,.2,1); }
      48%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    #capture-mark .draw-3 {
      stroke-dasharray: 1;
      animation: draw-3 4.8s linear both;
    }
    @keyframes draw-3 {
      0% { stroke-dashoffset: 1; opacity: 0; }
      35% { stroke-dashoffset: 1; opacity: 1;
        animation-timing-function: cubic-bezier(.2,.7,.2,1); }
      65%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #capture-mark path { animation: none; }
    }
  </style>
  <rect width="1200" height="580" fill="#f2f0e9"/>
  <g fill="#191a19" font-family="Arial, Helvetica, sans-serif">
    <path d="M48 48h1104" stroke="#191a19" stroke-width="6"/>
    <text x="48" y="92" font-size="32" font-weight="800"
          letter-spacing="-1.5">TOD–DL</text>
    <circle cx="179" cy="70" r="4" fill="#b52c18"/>
    <g font-size="11" font-weight="700" letter-spacing="1.4">
      <text x="1152" y="75" text-anchor="end">TOR ONION</text>
      <text x="1152" y="92" text-anchor="end">DUMP DOWNLOADER</text>
    </g>
    <rect x="48" y="126" width="652" height="330" fill="#e64b32"/>
    <g font-size="174" font-weight="900" letter-spacing="-13">
      <text x="76" y="279">TOD</text>
      <text x="76" y="422">DL</text>
    </g>
    <g font-size="8" font-weight="700" letter-spacing=".8">
      <text x="472" y="146">TOD–DL / CAPTURE MARK</text>
      <text x="676" y="146" text-anchor="end" aria-hidden="true">↘</text>
    </g>
    <path d="M472 154h204M472 411h204" stroke="#191a19"
          stroke-width=".7"/>
    <g font-size="7.5" font-weight="700" letter-spacing=".65">
      <text x="76" y="437">NATIVE ACQUISITION.</text>
      <text x="76" y="449">SIGNED PROVENANCE.</text>
      <text x="472" y="434">ACQUIRE / PRESERVE / VERIFY</text>
    </g>
    <!-- Canonical capture-mark geometry; embed unchanged in offline exports. -->
    <g id="capture-mark" transform="translate(436 165) scale(.58)"
       color="#191a19">
      <g fill="none" stroke="currentColor"
        stroke-width="1" opacity=".2" aria-hidden="true">
        <path d="M40 66h320M40 334h320M66 40v320M334 40v320"/>
        <path d="M32 32h12m-6-6v12M356 32h12m-6-6v12
          M32 368h12m-6-6v12M356 368h12m-6-6v12"/>
      </g>
      <g fill="none" stroke="currentColor" stroke-linecap="square"
        stroke-linejoin="miter">
        <path class="draw-0" pathLength="1" stroke-width="24"
          d="M294 66H66V294H112"/>
        <path class="draw-1" pathLength="1" stroke-width="18"
          d="M254 110H110V254H132"/>
        <path class="draw-2" pathLength="1" stroke-width="12"
          d="M214 150H150V214"/>
        <path class="draw-3" pathLength="1" stroke-width="28"
          stroke-linecap="butt"
          d="M202 202L320 320M248 320H320V248"/>
      </g>
    </g>
    <g font-size="65" font-weight="800" letter-spacing="-3.5">
      <text x="752" y="220">Acquire.</text>
      <text x="752" y="291">Preserve.</text>
      <text x="752" y="362">Verify<tspan fill="#b52c18">.</tspan></text>
    </g>
    <text x="754" y="420" font-size="17">A record of the acquisition.</text>
    <path d="M48 495h1104" stroke="#191a19" stroke-width="2"/>
    <g font-size="11" font-weight="700" letter-spacing="1.3">
      <text x="48" y="531">NATIVE ACQUISITION</text>
      <text x="460" y="531">DURABLE RECOVERY</text>
      <text x="1152" y="531" text-anchor="end">SIGNED PROVENANCE</text>
    </g>
    <text x="48" y="552" font-size="12" fill="#585952">
      Bounded input. Protected resume. Independent verification.
    </text>
  </g>
</svg>
